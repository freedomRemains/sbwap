<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>S3</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  </head>
  <body>
    <h1>S3</h1>

    <a th:href="@{/top}">TOP画面に戻る。</a>



    <div id="dropzone"
         style="width:300px;height:150px;border:2px dashed #888;text-align:center;line-height:150px;">
        ここにファイルをドロップ
    </div>

    <script>
        const dropzone = document.getElementById("dropzone");

        dropzone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropzone.style.borderColor = "blue";
        });

        dropzone.addEventListener("dragleave", () => {
            dropzone.style.borderColor = "#888";
        });

        dropzone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropzone.style.borderColor = "#888";

            const file = e.dataTransfer.files[0];
            uploadFile(file);
        });

        function uploadFile(file) {
            const formData = new FormData();
            formData.append("file", file);

            // Thymeleaf が埋め込んだ CSRF 情報を取得
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;

            fetch("/s3/upload/drop", {
                method: "POST",
                body: formData,
                headers: {
                    [header]: token
                }
            })
            .then(res => res.text())
            .then(msg => alert(msg))
            .catch(err => alert("アップロード失敗: " + err));
        }
    </script>



    <table border="1">
      <tbody>
        <tr>
          <td><a th:href="@{/s3/upload}">S3にアップロード</a></td>
          <td><a th:href="@{/s3/download}">S3からダウンロード</a></td>
          <td><a th:href="@{/s3/delete}">S3から削除</a></td>
        </tr>
      </tbody>
    </table>

    <p>
        サーバから受信した fileNames の値は以下の通りです。
    </p>
    <p>
        <span th:text="${fileNames}"></span>
    </p>

    <script th:src="@{/js/common.js}"></script>
  </body>
</html>
